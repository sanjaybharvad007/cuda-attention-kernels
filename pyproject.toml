[build-system]
requires = ["setuptools>=64", "wheel"]   # torch is taken from the environment (install with --no-build-isolation)
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set changed in 0.16 and CI installs the latest release.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731", "E741"]
